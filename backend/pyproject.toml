[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatmyvideo-backend"
version = "0.1.0"
description = "ChatMyVideo API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115,<1",
    "faiss-cpu>=1.9,<2",
    "groq>=0.11,<1",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.3,<6",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"